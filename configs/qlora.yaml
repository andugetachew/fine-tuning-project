model:
  base_model_id: "Qwen/Qwen2.5-1.5B-Instruct"
  trust_remote_code: false
  load_in_4bit: true

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

tokenizer:
  max_seq_length: 1024

dataset:
  train_path: "data/processed/train.jsonl"
  eval_path: "data/processed/eval.jsonl"
  prompt_template: "chatml"

training:
  output_dir: "models/checkpoints"
  num_train_epochs: 3
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  logging_steps: 10
  save_strategy: "epoch"
  eval_strategy: "epoch"
  bf16: true
  optim: "paged_adamw_8bit"
  report_to: "none"

environment:
  device_map: "auto"

evaluation:
  task_type: "structured"
  scorer_type: "exact_match"
